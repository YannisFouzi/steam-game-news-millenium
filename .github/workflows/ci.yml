name: CI

on:
  pull_request:
  push:
    branches: [main, fix/isolate-sentry-shared-steam-context]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # `millennium-ttc --build prod` bundle frontend + webkit (charge tsconfig,
      # echoue si erreur de type ou de bundling). Pas de tests unitaires sur cette
      # surface — le build est la garde minimale contre une regression.
      - name: Build plugin
        run: npm run build

      # One-time generated-bundle sync for this PR only; remove this step after
      # the compiled artifact has been committed. No deployment or release.
      - name: Commit generated bundle for Sentry fix
        if: github.event_name == 'push' && github.ref_name == 'fix/isolate-sentry-shared-steam-context'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .millennium/Dist/index.js .millennium/Dist/webkit.js
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate Millennium bundle after Sentry isolation'
            git push origin HEAD:refs/heads/fix/isolate-sentry-shared-steam-context
          fi
